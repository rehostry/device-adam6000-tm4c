#
# HALucinator reads `logging.cfg` from the process CWD if one exists, and this
# device is spawned with CWD == this configs dir. The shipped default leaves
# root at ERROR, which hides everything this device says about itself.
[loggers]
keys=root,halucinator.main,HAL_LOG,halucinator.backends.unicorn_backend

[handlers]
keys=consoleHandler

[formatters]
keys=sampleFormatter

[logger_root]
level=ERROR
handlers=consoleHandler

[logger_halucinator.main]
level=INFO
handlers=consoleHandler
propagate=0
qualname=halucinator.main

[logger_HAL_LOG]
level=INFO
handlers=consoleHandler
propagate=0
qualname=HAL_LOG

# The debug variant: backend at INFO, for HAL_PC_SAMPLE. Copy over logging.cfg.
# (The shipped logging.cfg keeps this at WARNING because) This device drives SysTick from
# instruction count (HAL_DET_TICK), and the backend logs a line for every
# injection and every exception return -- 453,842 pairs in one 60-second run,
# which is slower than the emulation it is reporting on. Raise this to INFO
# temporarily when you need HAL_PC_SAMPLE's histogram, which prints on this
# logger too.
[logger_halucinator.backends.unicorn_backend]
level=INFO
handlers=consoleHandler
propagate=0
qualname=halucinator.backends.unicorn_backend

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=sampleFormatter
args=(sys.stdout,)

[formatter_sampleFormatter]
format=%(name)s|%(levelname)s|  %(message)s
