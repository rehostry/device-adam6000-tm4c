#
# HALucinator reads `logging.cfg` from the process CWD if one exists, and this
# device is spawned with CWD == this configs dir. The shipped default leaves
# root at ERROR, which hides everything this device says about itself.
[loggers]
keys=root,halucinator.main,HAL_LOG,halucinator.backends.unicorn_backend

[handlers]
keys=consoleHandler

[formatters]
keys=sampleFormatter

[logger_root]
level=ERROR
handlers=consoleHandler

[logger_halucinator.main]
level=INFO
handlers=consoleHandler
propagate=0
qualname=halucinator.main

[logger_HAL_LOG]
level=INFO
handlers=consoleHandler
propagate=0
qualname=HAL_LOG

[logger_halucinator.backends.unicorn_backend]
level=INFO
handlers=consoleHandler
propagate=0
qualname=halucinator.backends.unicorn_backend

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=sampleFormatter
args=(sys.stdout,)

[formatter_sampleFormatter]
format=%(name)s|%(levelname)s|  %(message)s
