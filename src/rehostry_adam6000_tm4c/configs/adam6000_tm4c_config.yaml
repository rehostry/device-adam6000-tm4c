#
# Advantech ADAM-6050 (ADAM-6000 series DIO) -- HALucinator config, unicorn.
#
# Target: TI **TM4C129x** (Tiva C Connected, Cortex-M4F) running Advantech's
# bare-metal application: TivaWare + lwIP + an HTTP server + Modbus/TCP + SNMP
# + mbedTLS 3.6.0. An Ethernet remote digital-I/O module.
#
# THE SoC WAS IDENTIFIED, NOT ASSUMED -- see tools/extract_firmware.py:
#   * GPIO ports A..Q are addressed; only TM4C129x has ports past J.
#   * EMAC0 at 0x400EC000 -- an on-chip Ethernet MAC, TM4C129x only.
#   * The single live external interrupt is IRQ 40, which is TM4C129x's EMAC0.
#   * The image contains the literal `Cortex-M4` and TivaWare's `g_ui32*`
#     Hungarian notation throughout its debug output.
machine:
  arch: cortex-m3                 # HALucinator's M-profile support; the CPU
                                  # model is pinned to Cortex-M4 by spawn.py
                                  # (the reset handler's first act is to enable
                                  # CP10/CP11, so this part has an FPU).
  cpu_model: cortex-m3
  entry_addr: 0x0000F0A9          # Reset_Handler | Thumb
  init_sp: 0x2001C46C             # vector[0]
  vector_base: 0x00000000         # flash at zero on Tiva
  interrupt_controller:
    type: cortex_m

memories:
  # Landing pad for ROM calls: 16 KB of `bx lr`, generated by
  # tools/extract_firmware.py (derived, not firmware). One distinct stub per
  # driverlib API-table entry, so an unimplemented call returns immediately
  # instead of branching somewhere arbitrary -- and so a call that DOES need an
  # implementation can be given one by name, at its own address.
  rom_stubs:
    base_addr: 0x01010000
    file: rom_stubs.bin
    permissions: rwx
    size: 0x00004000

  # 1 MB flash on a TM4C1294; the vendor image occupies the first 421 KB.
  flash:
    base_addr: 0x00000000
    file: adam6000_tm4c.bin
    permissions: rwx
    size: 0x00100000
  sram:
    base_addr: 0x20000000
    permissions: rw-
    size: 0x00040000
  halucinator-irq:
    base_addr: 0x03ffc000
    size: 0x00004000
  halucinator:
    base_addr: 0x04000000
    size: 0x00100000

peripherals:
  # The TM4C's masked ROM. The firmware calls TivaWare driverlib through the
  # API table at 0x01000010, and the ROM's contents are in silicon we do not
  # have -- so the table is synthesised and every entry points at a `bx lr`
  # stub. See peripheral_models/tiva_rom.py for why leaving this to the
  # catch-all is actively worse than leaving it unmapped.
  rom:
    base_addr: 0x01000000
    emulate: rehostry_adam6000_tm4c.peripheral_models.tiva_rom.TivaRom
    permissions: rw-
    size: 0x00008000

  # Everything from GPIO through EMAC0 to SYSCTL, in one window for now --
  # the bare-march starts here and each gate gets a real model as it appears.
  soc:
    base_addr: 0x40000000
    emulate: rehostry_adam6000_tm4c.peripheral_models.tiva_apb.TivaApb
    permissions: rw-
    size: 0x00100000
  # AES/DES/SHA accelerators (TM4C129x puts them well above the APB window).
  crypto:
    base_addr: 0x44000000
    emulate: rehostry_adam6000_tm4c.peripheral_models.soc_catchall.SocCatchAll
    permissions: rw-
    size: 0x00040000
  # The whole 1 MB: the backend maps the PPB in one call, so a partial claim
  # leaves the remainder unmapped (playbook §2.68).
  ppb:
    base_addr: 0xE0000000
    emulate: rehostry_adam6000_tm4c.peripheral_models.cortexm_ppb.CortexMPpb
    permissions: rw-
    size: 0x00100000

intercepts:
  # Diagnostic only: the vector table sends almost everything to one shared
  # `b .`, so reaching it says nothing about its own cause. This asks.
  - class: rehostry_adam6000_tm4c.bp_handlers.fault_probe.FaultProbe
    function: default_handler_spin
  - class: rehostry_adam6000_tm4c.bp_handlers.fault_probe.FaultProbe
    function: lwip_trap_spin

  # TivaWare ROM entry points. These addresses are OURS -- tiva_rom.py hands
  # them to the firmware when it answers the ROM API table -- so they are
  # synthetic symbols, not recovered ones. See bp_handlers/tiva_rom_api.py.
  - class: rehostry_adam6000_tm4c.bp_handlers.tiva_rom_api.TivaRomApi
    function: rom_UARTCharPut
  - class: rehostry_adam6000_tm4c.bp_handlers.tiva_rom_api.TivaRomApi
    function: rom_UARTBusy
  - class: rehostry_adam6000_tm4c.bp_handlers.tiva_rom_api.TivaRomApi
    function: rom_UARTConfigSetExpClk
  - class: rehostry_adam6000_tm4c.bp_handlers.tiva_rom_api.TivaRomApi
    function: rom_UARTEnable
  - class: rehostry_adam6000_tm4c.bp_handlers.tiva_rom_api.TivaRomApi
    function: rom_GPIOPinConfigure
  - class: rehostry_adam6000_tm4c.bp_handlers.tiva_rom_api.TivaRomApi
    function: rom_GPIOPinTypeUART
  - class: rehostry_adam6000_tm4c.bp_handlers.tiva_rom_api.TivaRomApi
    function: rom_SysCtlPeripheralEnable
  - class: rehostry_adam6000_tm4c.bp_handlers.tiva_rom_api.TivaRomApi
    function: rom_SysCtlPeripheralPresent
  - class: rehostry_adam6000_tm4c.bp_handlers.tiva_rom_api.TivaRomApi
    function: rom_SysCtlPeripheralReady
  - class: rehostry_adam6000_tm4c.bp_handlers.tiva_rom_api.TivaRomApi
    function: rom_SysCtlPeripheralReset
  - class: rehostry_adam6000_tm4c.bp_handlers.tiva_rom_api.TivaRomApi
    function: rom_SSIDataPut
  - class: rehostry_adam6000_tm4c.bp_handlers.tiva_rom_api.TivaRomApi
    function: rom_SSIDataGet
  - class: rehostry_adam6000_tm4c.bp_handlers.tiva_rom_api.TivaRomApi
    function: rom_GPIOPinWrite
  - class: rehostry_adam6000_tm4c.bp_handlers.tiva_rom_api.TivaRomApi
    function: rom_uDMAIntStatus
  - class: rehostry_adam6000_tm4c.bp_handlers.tiva_rom_api.TivaRomApi
    function: rom_uDMAChannelTransferSet
  - class: rehostry_adam6000_tm4c.bp_handlers.tiva_rom_api.TivaRomApi
    function: rom_uDMAChannelEnable
  - class: rehostry_adam6000_tm4c.bp_handlers.tiva_rom_api.TivaRomApi
    function: rom_uDMAIntClear
