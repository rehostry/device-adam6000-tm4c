[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rehostry-adam6000-tm4c"
version = "0.0.1"
description = "Advantech ADAM-6050 (TI TM4C129x) Ethernet remote digital-I/O module as a standalone, pip-installable HALucinator device."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Christopher Wright" }]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
keywords = ["halucinator", "rehosting", "firmware", "emulation"]

# Runtime deps for the standalone CLI + web panel. HALucinator itself is a
# runtime dependency too, but it is not on PyPI, so it is NOT listed here --
# install the dev core into the same venv
# (`halucinator[unicorn] @ git+https://github.com/rehostry/halucinator.git@fleet-census-2026-08-19`)
# so `sys.executable` / `HAL_PY` reaches it. No `HALUCINATOR_SRC` injection.
# TODO: trim to what your panel/attack actually import.
dependencies = [
    "pyzmq>=24",
    "PyYAML>=6",
]

[project.optional-dependencies]
# Needed only for the co-simulation binding (rehostry_adam6000_tm4c.binding.make_device).
orchestrator = ["rehostry-orchestrator"]
dev = ["pytest>=7"]

[project.scripts]
rehostry-adam6000-tm4c = "rehostry_adam6000_tm4c.cli:main"
rehostry-adam6000-tm4c-panel = "rehostry_adam6000_tm4c.adam6000_panel:main"
rehostry-adam6000-tm4c-attack = "rehostry_adam6000_tm4c.attack:main"

# Forward-looking: once HALucinator gains entry-point plugin discovery, installing
# this package will auto-register the device. Harmless until then.
[project.entry-points."halucinator.devices"]
adam6000-tm4c = "rehostry_adam6000_tm4c:DEVICE_NAME"

[project.urls]
Homepage = "https://github.com/rehostry/device-adam6000-tm4c"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the configs (incl. the derived addr map). Firmware bytes are NOT shipped
# by default -- they are .gitignore'd and regenerated by tools/extract_firmware.py.
# ONLY if your firmware is redistributable (document the licences in
# PROVENANCE.md, as device-plc does) add "configs/*.bin", "configs/*.elf" here
# and un-ignore them in .gitignore.
rehostry_adam6000_tm4c = ["configs/*.yaml"]
